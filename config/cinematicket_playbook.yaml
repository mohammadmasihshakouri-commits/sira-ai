business:
  name: "Cinematicket"
  language: "fa"
  tone: "polite_friendly_call_center"
  default_fallback: "متوجه شدم. برای اینکه دقیق‌تر راهنمایی‌تون کنم، لطفاً موضوع رو یک بار کوتاه‌تر بفرمایید."

domain:
  allowed_topics:
    - بلیت
    - بلیط
    - رزرو
    - کد رزرو
    - پرداخت
    - پیامک
    - اس ام اس
    - کنسلی
    - استرداد
    - برگشت وجه
    - صندلی
    - سالن
    - سانس
    - اکران
    - سینما
    - تئاتر
    - کیف پول
    - سفارش
    - پشتیبانی

  out_of_domain_response:
    fa:
      - "من فقط می‌تونم درباره خدمات و پشتیبانی همین مجموعه راهنمایی‌تون کنم."
      - "در این تماس فقط می‌تونم درباره خدمات همین مجموعه کمک‌تون کنم."

    en:
      - "I can only help with this business's services and support."

slot_flows:
  cancellation_request:
    priority: 95
    triggers:
      - "میخوام کنسل کنم"
      - "می‌خوام کنسل کنم"
      - "کنسلش کنم"
      - "کنسلی"
      - "استرداد"
      - "پسش بدم"
      - "پسش بدهم"
      - "میخوام پسش بدم"
      - "می‌خوام پسش بدم"
      - "میخوام پسش بدهم"
      - "بلیت رو پس بدم"
      - "بلیتم رو پس بدم"
      - "پولم برگرده"

    slot:
      name: "reservation_code"
      type: "digits"
      length: 8

    ask:
      fa:
        - "حتماً، لطفاً کد رزرو ۸ رقمی رو دو رقم دو رقم بفرمایید."

    invalid:
      fa:
        - "کد رزرو باید ۸ رقمی باشه. لطفاً دوباره بفرمایید."

    confirm:
      fa:
        - "درسته؟ {value} شد کد رزرو."

    unclear_confirmation:
      fa:
        - "متوجه تأیید نشدم. {value} درسته؟"

    rejected:
      fa:
        - "لطفاً کد رزرو ۸ رقمی رو دوباره بفرمایید."

    completed:
      fa:
        - "ممنونم، کد رزرو ثبت شد. برای ادامه باید در سیستم بررسی بشه."
        
intents:

  greeting:
    title: "سلام و شروع مکالمه"
    priority: 10
    triggers:
      - "سلام"
      - "وقتتون بخیر"
      - "صبحتون بخیر"
      - "ظهرتون بخیر"
      - "عصرتون بخیر"
      - "شبتون بخیر"
      - "خسته نباشید"
    response:
      fa:
        - "سلام، ممنونم ازتون. بفرمایید چطور می‌تونم کمک‌تون کنم؟"
        - "سلام، خیلی ممنون. بفرمایید چطور می‌تونم راهنمایی‌تون کنم؟"
        - "سلام، لطف دارید. بفرمایید چه کمکی از دستم برمیاد؟"
    notes:
      - "اگر مشتری اول مکالمه وقت بخیر، خسته نباشید یا مشابه آن گفت، پاسخ حتماً باید شامل تشکر باشد."
      - "نباید فقط گفته شود: بفرمایید."

  ticket_sms_missing:
    title: "پیامک بلیت ارسال نشده"
    priority: 90
    triggers:
      - "پیامک نیومده"
      - "پیامکش نیومده"
      - "پیامک نشده"
      - "اطلاعات بلیت پیامک نشده"
      - "بلیت برام پیامک نشده"
      - "اس ام اس نیومده"
      - "بلیت خریدم پیامکش نیومده"
      - "خرید بلیت انجام دادم پیامک نیومده"
    required_slots:
      - "phone_or_reservation_code"
    response:
      fa:
        - "بله، متوجه شدم. لطفاً شماره موبایل یا کد رزرو رو بفرمایید تا بررسی بشه."
        - "حتماً، برای بررسی لطفاً شماره موبایل یا کد رزرو رو بفرمایید."
    notes:
      - "عبارت شماره موبایل خرید استفاده نشود؛ فقط گفته شود شماره موبایل."
      - "اگر مشتری کد رزرو یا شماره را گفت، سیستم باید ابتدا تأیید بگیرد."

  cancellation_request:
    title: "درخواست کنسلی یا استرداد"
    priority: 95
    triggers:
      - "میخوام کنسل کنم"
      - "می‌خوام کنسل کنم"
      - "کنسلش کنم"
      - "کانسلش کنم"
