        - "ببخشید، صداتون واضح نبود. لطفاً دوباره بفرمایید."
    rules:
      - "اگر STT خراب بود، متن به Ollama یا Memory فرستاده نشود."

global_guardrails:
  - "پاسخ‌ها باید کوتاه، محترمانه و تلفنی باشند."
  - "از ادعاهای قطعی درباره انجام کنسلی، برگشت وجه یا تغییر وضعیت سفارش خودداری شود."
  - "اگر نیاز به بررسی سیستم وجود دارد، باید شماره موبایل یا کد رزرو گرفته شود."
  - "کد رزرو سینماتیکت ۸ رقمی است."
  - "شماره موبایل ایران باید با صفر اول تأیید شود."
