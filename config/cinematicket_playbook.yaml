    response:
      fa:
        - "حتماً، لطفاً کد رزروتون رو بگید تا راهنمایی‌تون کنم."
        - "بله حتماً، لطفاً کد رزروتون رو می‌فرمایید تا راهنمایی‌تون کنم؟"
    rules:
      - "برای بررسی کنسلی فقط کد رزرو گرفته می‌شود."
      - "سیستم بعد از دریافت کد رزرو، زمان سانس را بررسی می‌کند."
      - "اگر کمتر از دو ساعت به اکران مانده باشد، طبق قوانین امکان کنسلی وجود ندارد."
      - "اگر بیشتر از دو ساعت مانده باشد، امکان راهنمایی برای کنسلی وجود دارد."
    forbidden:
      - "نباید گفته شود بلیت شما کنسل شد."
      - "نباید گفته شود وجه برگشت خورد."
      - "نباید بدون بررسی سیستم درباره امکان کنسلی حکم قطعی بدهد."

  reservation_code_help:
    title: "راهنمای پیدا کردن کد رزرو"
    priority: 80
    triggers:
      - "کد رزرو کجاست"
      - "کد رزرو رو از کجا ببینم"
      - "کد رزرو ندارم"
      - "کد رزرو کجا نوشته"
      - "از کجا کد رزرو رو پیدا کنم"
      - "کد رزرو را کجا ببینم"
    response:
      fa:
        - "برای دیدن کد رزرو، وارد حساب کاربری‌تون بشید، از بالای صفحه روی نام اکانت بزنید، وارد بخش بلیت‌های من بشید، بعد از قسمت فعال روی جزئیات بلیت بزنید. کد رزرو پایین صفحه، بالای بارکد نوشته شده."
    notes:
      - "کد رزرو پایین صفحه و بالای بارکد قرار دارد."
      - "به جای کد خطی بهتر است گفته شود بارکد."

  tiwall_cancellation:
    title: "کنسلی بلیت‌های تیوال"
    priority: 100
    triggers:
      - "تیوال"
      - "تی وال"
      - "بلیت تیوال"
      - "نمایش تیوال"
      - "از تیوال خریدم"
    response:
      fa:
        - "شرمنده، بلیت‌های تیوال طبق قوانین قابل کنسلی نیستن."
    rules:
      - "برای بلیت‌های تیوال گفته نشود از سمت سینماتیکت قابل کنسلی نیست."
      - "قانون کلی تیوال این است که این بلیت‌ها قابل کنسلی نیستند."

  seat_reserved_issue:
    title: "صندلی زرد یا رزرو موقت بعد از شارژ کیف پول"
    priority: 85
    triggers:
      - "صندلی زرد"
      - "صندلی رزرو شده"
      - "صندلی رزرو مونده"
      - "صندلی خالی نمیشه"
      - "صندلی آزاد نمیشه"
      - "صندلی انتخاب نمیشه"
      - "کیف پولم شارژ نداشت"
      - "رفتم کیف پول رو شارژ کنم"
      - "اومدم بیرون کیف پول رو شارژ کنم"
      - "صندلی به رنگ زرد"
      - "رزرو موقت"
    response:
      fa:
        - "بله، متوجه شدم. اگر صندلی به رنگ زرد یا همون حالت رزرو موقت نمایش داده می‌شه، معمولاً حدود ۱۰ دقیقه زمان می‌بره تا از حالت رزرو خارج بشه. بعد از اون دوباره می‌تونید همون صندلی رو انتخاب کنید."
    rules:
      - "صندلی زرد یعنی حالت رزرو موقت."
      - "به مشتری گفته شود حدود ۱۰ دقیقه صبر کند."
      - "نباید قطعی گفته شود حتماً آزاد می‌شود؛ بهتر است گفته شود معمولاً حدود ۱۰ دقیقه زمان می‌برد."

  invalid_code:
    title: "کد نامعتبر در سایت یا هنگام ورود اطلاعات"
    priority: 75
    triggers:
      - "کد نامعتبره"
      - "کد رو میزنم نامعتبره"
      - "کد قبول نمیشه"
      - "کد کار نمیکنه"
      - "کد خطا میده"
      - "نامعتبر میزنه"
    response:
      fa:
        - "متوجه شدم. لطفاً یک بار موبایلتون رو خاموش و روشن کنید و بعد دوباره با مرورگر دیگه یا حالت ناشناس امتحان کنید. اگر باز هم خطا داشت، شماره موبایل یا کد رزرو رو بفرمایید تا بررسی بشه."
    notes:
      - "این سناریو از تماس واقعی دیده شده."
      - "ممکن است مربوط به کد تأیید، کد رزرو یا خطای سایت باشد؛ اگر مشخص نبود، باید شماره موبایل یا کد رزرو گرفته شود."

  late_arrival:
    title: "دیر رسیدن به سالن یا شروع اکران"
    priority: 70
    triggers:
      - "دیر برسیم"
      - "دیرتر برسیم"
      - "بعد از شروع فیلم برسیم"
      - "بعد از شروع اکران برسیم"
      - "میتونیم وارد سالن بشیم"
      - "اگر دیر برسیم راه میدن"
      - "چند دقیقه زودتر باید برسیم"
    response:
      fa:
        - "طبق قوانینی که موقع خرید نمایش داده می‌شه، بهتره حداقل ۲۰ دقیقه زودتر داخل سالن حضور داشته باشید. برای ورود بعد از شروع اکران، تصمیم نهایی با خود سینماست و بهتره با سینما هماهنگ کنید."
    rules:
      - "در مورد راه دادن بعد از شروع اکران، حکم قطعی داده نشود."
      - "به مشتری گفته شود تصمیم نهایی با سینماست."

  audio_issue:
