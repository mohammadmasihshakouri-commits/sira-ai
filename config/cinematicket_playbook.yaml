      - "می‌خوام پسش بدم"
      - "بلیت رو پس بدم"
      - "بلیتم رو پس بدم"
      - "پولم برگرده"
      - کنسل
      - کنسلی
      - استرداد
      - پس بدم
      - پسش بدم
      - میخوام پسش بدم
      - میخوام پسش بدهم
      - میخوام کنسل کنم
      - پولم برگرده
      - برگشت وجه
      
    required_slots:
